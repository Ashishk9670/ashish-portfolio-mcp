name = "ashish-portfolio-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[alias]
"ai" = "./shims/ai.ts"

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "PortfolioMCP" }
]

[[kv_namespaces]]
binding = "VISITORS"
id = "471a4e9deb7f495b8a91c26b1682be4c"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortfolioMCP"]

[[d1_databases]]
binding = "ANALYTICS"
database_name = "portfolio-analytics"
database_id = "39a62b0d-dab4-4c02-a475-6209018009b6"
migrations_dir = "migrations"

# Per-client abuse guard for the public /event endpoint (the key is never stored).
[[ratelimits]]
name = "EVENT_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Per-client guard for the "Ask about Ashish" assistant (the key is never stored).
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1002"
simple = { limit = 6, period = 60 }

[ai]
binding = "AI"

# Daily retention sweep (03:17 UTC) and the weekly analytics digest (Mondays 03:30 UTC = 09:00 IST).
[triggers]
crons = ["17 3 * * *", "30 3 * * 1"]

