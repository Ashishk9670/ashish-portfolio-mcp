name = "ashish-portfolio-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[alias]
"ai" = "./shims/ai.ts"

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "PortfolioMCP" }
]

[[kv_namespaces]]
binding = "VISITORS"
id = "471a4e9deb7f495b8a91c26b1682be4c"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortfolioMCP"]

[[d1_databases]]
binding = "ANALYTICS"
database_name = "portfolio-analytics"
database_id = "39a62b0d-dab4-4c02-a475-6209018009b6"
migrations_dir = "migrations"

# Per-client abuse guard for the public /event endpoint (the key is never stored).
[[ratelimits]]
name = "EVENT_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Daily retention sweep: raw events older than 90 days are deleted.
[triggers]
crons = ["17 3 * * *"]

